<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini AV</title>
<style>
:root{
  --bg:#060912; --text:#e9eef8; --mut:#94a1ba; --dim:#64708a;
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.095); --line:rgba(255,255,255,.12);
  --a1:#2fe6c6; --a2:#4d8dff; --ok:#3ddc97; --warn:#ffb454; --bad:#ff5d73; --r:18px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.6 "Segoe UI","Vazirmatn",Tahoma,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(1200px 700px at 80% -10%,#10223a 0%,transparent 60%),#060912}
.bg i{position:absolute;border-radius:50%;filter:blur(100px);opacity:.5;animation:drift 22s ease-in-out infinite alternate}
.bg .b1{width:520px;height:520px;background:#12b8a0;top:-160px;inset-inline-start:-120px}
.bg .b2{width:560px;height:560px;background:#2b5fd9;bottom:-220px;inset-inline-end:-120px;animation-delay:-8s}
.bg .b3{width:380px;height:380px;background:#6a3fd1;top:38%;inset-inline-start:38%;opacity:.28;animation-delay:-14s}
@keyframes drift{to{transform:translate(60px,40px) scale(1.12)}}
.app{position:relative;z-index:1;display:flex;height:100vh;padding:14px;gap:14px}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border-radius:var(--r);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.lg{width:28px;height:28px}.ic.sm{width:16px;height:16px}

/* sidebar */
.side{width:224px;flex:none;display:flex;flex-direction:column;padding:16px 12px;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .logo{width:38px;height:38px;flex:none}
.brand b{display:block;font-size:16px;letter-spacing:.2px}
.brand small{display:block;color:var(--mut);font-size:11px;line-height:1.3}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:1px solid transparent;border-radius:12px;background:none;color:var(--mut);cursor:pointer;text-align:start;transition:.15s}
.nav:hover{background:var(--glass);color:var(--text)}
.nav.on{background:linear-gradient(135deg,rgba(47,230,198,.16),rgba(77,141,255,.16));border-color:rgba(120,200,255,.28);color:#fff}
.nav .badge{margin-inline-start:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;min-width:20px;text-align:center}
.grow{flex:1}
.seg{display:flex;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:6px 10px;border-radius:9px;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--glass2);color:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.sidefoot{display:flex;flex-direction:column;gap:10px;padding:10px 4px 2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--glass);border:1px solid var(--line);color:var(--mut)}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}

/* main */
main{flex:1;min-width:0;overflow:auto;padding:2px 4px 18px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.page{display:none;animation:fade .25s ease}.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
h1{margin:6px 0 4px;font-size:22px}h2{margin:0 0 10px;font-size:16px}
.sub{color:var(--mut);margin:0 0 16px}
.card{padding:18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.mt{margin-top:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--glass2);padding:9px 16px;border-radius:12px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.15)}
.btn:focus-visible,.nav:focus-visible,.seg button:focus-visible,.mode:focus-visible,input:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{border:0;color:#04141a;font-weight:600;background:linear-gradient(135deg,var(--a1),var(--a2))}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border:0;color:#fff;font-weight:600;background:linear-gradient(135deg,#ff5d73,#d6204a)}
.btn.danger:hover{filter:brightness(1.1)}
.btn.sm{padding:5px 11px;border-radius:10px;font-size:13px}
.btn.ghost{background:none}

/* hero */
.hero{display:flex;align-items:center;gap:26px;padding:26px;position:relative;overflow:hidden}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg.r{width:150px;height:150px;transform:rotate(-90deg)}
.ring .shield{position:absolute;inset:0;display:grid;place-items:center}
.ring .shield .ic{width:56px;height:56px;stroke-width:1.6}
.hero.ok{--c1:var(--a1);--c2:var(--a2)}.hero.warn{--c1:#ffd37a;--c2:#ff9a3d}.hero.bad{--c1:#ff8aa0;--c2:#ff3d63}.hero.unk{--c1:#8fa3c8;--c2:#5d6e94}
.hero .shield{color:var(--c1);filter:drop-shadow(0 0 14px var(--c2))}
.hero:after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;inset-inline-end:-90px;top:-120px;background:radial-gradient(circle,var(--c2),transparent 65%);opacity:.22;pointer-events:none}
.hero h1{font-size:26px;margin:0}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{display:flex;gap:12px;align-items:flex-start}
.stat .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--glass2);flex:none}
.stat .ico.ok{color:var(--ok)}.stat .ico.warn{color:var(--warn)}.stat .ico.bad{color:var(--bad)}.stat .ico.unk{color:var(--mut)}
.stat small{display:block;color:var(--mut)}
.stat b{font-weight:600}

/* scan page */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:start;padding:16px;border-radius:16px;background:var(--glass);border:1px solid var(--line);cursor:pointer;transition:.15s}
.mode:hover{background:var(--glass2)}
.mode.on{border-color:rgba(47,230,198,.6);background:linear-gradient(135deg,rgba(47,230,198,.14),rgba(77,141,255,.12));box-shadow:0 0 0 3px rgba(47,230,198,.12)}
.mode .ic{color:var(--a1)}.mode b{font-size:15px}.mode span{color:var(--mut);font-size:12.5px}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:14px}
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0}
.sw i{width:40px;height:22px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:.2s;flex:none}
.sw i:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:linear-gradient(135deg,var(--a1),var(--a2))}
.sw input:checked+i:after{inset-inline-start:21px}
.sw input:focus-visible+i{outline:2px solid var(--a1);outline-offset:2px}
.custom{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1;min-width:200px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:9px 12px;direction:ltr;text-align:start}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--glass2);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 10px;direction:ltr;max-width:100%}
.tag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:380px}
.tag button{border:0;background:none;color:var(--mut);cursor:pointer;display:grid;place-items:center;padding:2px}
.tag button:hover{color:var(--bad)}
.drv{cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:10px;background:var(--glass);border:1px solid var(--line)}
.drv:hover{background:var(--glass2)}.drv small{color:var(--mut)}

.prog{margin-top:14px;display:none}.prog.on{display:block}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;position:relative}
.bar i{position:absolute;inset-block:0;width:35%;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a2));animation:slide 1.4s ease-in-out infinite}
.bar.done i{animation:none;width:100%}
@keyframes slide{0%{inset-inline-start:-35%}100%{inset-inline-start:100%}}
.phases{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 8px}
.ph{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.ph.on{color:#04141a;background:linear-gradient(135deg,var(--a1),var(--a2));border:0;font-weight:600}.ph.fin{color:var(--ok)}
.cur{direction:ltr;text-align:left;color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:19px}
.bulk{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.bulk .grow{min-width:20px}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow .nm{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.trow .ds{color:var(--mut);font-size:12.5px}
.path{direction:ltr;text-align:left;color:#b9c6e0;font:12px/1.5 Consolas,"Cascadia Mono",monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:11px;padding:1px 9px;border-radius:99px;border:1px solid}
.pill.high{color:var(--bad);border-color:rgba(255,93,115,.5);background:rgba(255,93,115,.1)}
.pill.medium{color:var(--warn);border-color:rgba(255,180,84,.5);background:rgba(255,180,84,.1)}
.pill.info{color:var(--a2);border-color:rgba(77,141,255,.5);background:rgba(77,141,255,.1)}
.st{font-size:13px}.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}.st.mut{color:var(--mut)}
.cb{width:18px;height:18px;accent-color:#2fe6c6;cursor:pointer}
.empty{display:grid;place-items:center;gap:10px;padding:34px 10px;color:var(--mut);text-align:center}
.empty .ic{width:42px;height:42px;color:var(--ok)}

/* quarantine */
.qhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.qrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.qico{width:38px;height:38px;border-radius:11px;background:rgba(255,93,115,.12);color:var(--bad);display:grid;place-items:center}
.meta{color:var(--mut);font-size:12px}

/* settings */
.srow{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.srow:first-of-type{border-top:0}
.srow .tx{flex:1;min-width:220px}.srow .tx small{display:block;color:var(--mut)}
.mono{font-family:Consolas,monospace;direction:ltr;unicode-bidi:isolate}

/* modal + toast */
.veil{position:fixed;inset:0;z-index:20;background:rgba(3,6,14,.6);backdrop-filter:blur(6px);display:none;place-items:center;padding:20px}
.veil.on{display:grid;animation:fade .15s}
.modal{width:min(480px,100%);padding:24px}
.modal h2{display:flex;align-items:center;gap:10px;font-size:18px}
.modal p{color:var(--mut);margin:6px 0 18px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--bad);font-size:13px;margin:-6px 0 12px}
#toasts{position:fixed;z-index:30;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
[dir=rtl] #toasts{transform:translateX(50%)}
.toast{background:rgba(18,26,44,.92);border:1px solid var(--line);padding:10px 18px;border-radius:12px;backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.4);animation:fade .2s}
.toast.bad{border-color:rgba(255,93,115,.6)}.toast.ok{border-color:rgba(61,220,151,.6)}

@media (max-width:980px){
  .side{width:68px;padding:12px 8px}.brand div,.nav span,.nav .badge,.sidefoot .chip{display:none}
  .sidefoot .seg{flex-direction:column}.seg button{min-width:0;padding:5px 2px;font-size:11px}.sidefoot{padding-inline:0}.brand{justify-content:center;padding-inline:0}.nav{justify-content:center;padding:12px 0}
  .hero{flex-direction:column;text-align:center}
}
[dir=rtl] .path,[dir=rtl] .cur{text-align:right}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<div class="app">
  <aside class="side glass">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="url(#lg)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-shield"/></svg>
      <div><b>Mini AV</b><small data-i18n="tagline"></small></div>
    </div>
    <button class="nav on" data-page="home"><svg class="ic"><use href="#i-home"/></svg><span data-i18n="nav_home"></span></button>
    <button class="nav" data-page="scan"><svg class="ic"><use href="#i-scan"/></svg><span data-i18n="nav_scan"></span><em class="badge" id="navBadge" hidden>0</em></button>
    <button class="nav" data-page="quarantine"><svg class="ic"><use href="#i-lock"/></svg><span data-i18n="nav_quarantine"></span></button>
    <button class="nav" data-page="settings"><svg class="ic"><use href="#i-sliders"/></svg><span data-i18n="nav_settings"></span></button>
    <div class="grow"></div>
    <div class="sidefoot">
      <span class="chip" id="adminChip"><svg class="ic sm"><use href="#i-key"/></svg><span id="adminChipTx"></span></span>
      <div class="seg" role="group" aria-label="Language">
        <button data-lang="fa">فارسی</button><button data-lang="en">English</button>
      </div>
    </div>
  </aside>

  <main>
    <!-- HOME -->
    <section class="page on" id="p-home">
      <div class="glass hero ok" id="hero">
        <div class="ring">
          <svg class="r" viewBox="0 0 150 150" aria-hidden="true">
            <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--c1)"/><stop offset="1" stop-color="var(--c2)"/></linearGradient></defs>
            <circle cx="75" cy="75" r="66" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="9"/>
            <circle cx="75" cy="75" r="66" fill="none" stroke="url(#rg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="415" stroke-dashoffset="0"/>
          </svg>
          <div class="shield"><svg class="ic" id="heroIcon"><use href="#i-shield"/></svg></div>
        </div>
        <div>
          <h1 id="heroTitle"></h1>

window.AV = { on(name, d) { if (H[name]) H[name](d); } };

/* ───────────── wiring ───────────── */
document.querySelectorAll(".nav").forEach(b => b.addEventListener("click", () => go(b.dataset.page)));
document.querySelectorAll(".seg button[data-lang]").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
$("#optDef").addEventListener("change", e => { S.defender = e.target.checked; send("setopt", "defender", S.defender ? 1 : 0); });
$("#btnAdd").addEventListener("click", () => { addPath($("#pathIn").value); $("#pathIn").value = ""; });
$("#pathIn").addEventListener("keydown", e => { if (e.key === "Enter") { addPath(e.target.value); e.target.value = ""; } });
$("#btnBrowse").addEventListener("click", () => send("browse"));
$("#btnStart").addEventListener("click", () => {
  if (S.mode === "custom" && !S.paths.length) { toast(t("need_path"), "bad"); return; }
  if (!S.admin && !S.adminSkipped) { $("#adminErr").hidden = true; modal("#vAdmin", true); return; }
  startScan();
});
$("#btnStop").addEventListener("click", () => { S.stopping = true; send("stop"); renderAll(); });
$("#adminAllow").addEventListener("click", () => send("elevate"));
$("#adminCancel").addEventListener("click", () => modal("#vAdmin", false));
$("#adminSkip").addEventListener("click", () => { S.adminSkipped = true; modal("#vAdmin", false); if (S.page === "scan") startScan(); });
$("#btnKill").addEventListener("click", () => modal("#vKill", true));
$("#killCancel").addEventListener("click", () => modal("#vKill", false));
$("#killGo").addEventListener("click", () => { $("#killGo").disabled = true; send("killall"); });
for (const [id, m] of [["#hQuick", "quick"], ["#hFull", "full"], ["#hCustom", "custom"]]) $(id).addEventListener("click", () => { S.mode = m; go("scan"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { modal("#vAdmin", false); modal("#vKill", false); } });

applyLang();
send("init");
</script>
</body>
</html>
